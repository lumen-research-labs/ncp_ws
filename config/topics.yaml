# Topic names, and THE COMMAND-SOURCE TABLE.
#
# The central invariant: /cmd_vel has exactly ONE publisher, rm_safety.
# Command sources publish to namespaced INPUT topics and have no route to the
# base driver. Anything that adds a second publisher to /cmd_vel is a bug,
# not a shortcut.
#
# `command_sources` is LIVE CONFIGURATION, read at startup by three things:
#   * rm_safety/safety_node   subscribes to every row and forwards the ONE
#                             row named by its `command_source` parameter;
#                             a name not in this table is refused, at startup
#                             and at runtime (rm_safety/command_sources.py is
#                             the loader and validator).
#   * rm_bringup/ncp.launch.py  starts one policy node per `profiles:=` entry,
#                             named and topic'd from the row of the same name.
#   * rm_dashboard            renders one source button per row, follows the
#                             active policy's `debug` stream, and re-targets
#                             goals on every row that has a `node`.
# Adding a policy is a row here, a profile in ncp.launch.py's _PROFILES table,
# a contract file and a checkpoint. Everything else follows the table.
#
# Row fields:
#   topic        the Twist topic rm_safety subscribes to. Never /cmd_vel.
#   kind         "teleop" (an operator path: gamepad, waypoints, WASD jog) or
#                "policy" (a network drives; linear.y is a bug, not a command).
#   node         the rm_policy policy_node that publishes the row, when one of
#                ours does. The dashboard re-targets goals through
#                /<node>/set_parameters_atomically. Omit for rows published by
#                something that takes no goal (the upstream consumer, the
#                bench tools).
#   debug        the node's one-line JSON status stream (observation, action,
#                pose, checkpoint hash). Policy rows only.
#   description  shown as the dashboard button's tooltip.
#
# !! The previous team's stack (LumenLabs/firmware, cpt_b2) publishes /cmd_vel
# !! DIRECTLY from cpt_b2_engine, with no safety layer — its e-stop is a
# !! browser button. cpt_b2_engine and rm_safety must NEVER run at the same
# !! time on the same ROS_DOMAIN_ID: that is two publishers on /cmd_vel and
# !! the base driver will interleave them.

base_driver:
  # Sole publisher: rm_safety. Sole subscriber: the vendor base driver.
  cmd_vel: /cmd_vel

command_sources:
  # The default and the safe direction: everything an operator drives with.
  # Must exist, must be kind teleop. rm_safety starts here.
  teleop:
    topic: /teleop/cmd_vel
    kind: teleop
    description: gamepad, waypoints and the WASD jog (rm_waypoint)
  # The upstream NCP-on-Rosmaster consumer (consumer:=upstream) and the bench
  # and calibration tools (scripts/diagnostics/*, drive_test.sh) publish here.
  # No node: nothing on this row takes a goal.
  policy:
    topic: /policy/cmd_vel
    kind: policy
    debug: /ncp_debug
    description: upstream consumer (consumer:=upstream) or a bench tool
  # One row per trained policy. ncp.launch.py starts policy_node_<name> on
  # these topics for every profile listed in profiles:= (default both).
  m8v2:
    topic: /policy/m8v2/cmd_vel
    kind: policy
    node: policy_node_m8v2
    debug: /ncp_debug/m8v2
    description: M8-v2, 720 beams over 270 deg, interface 4.0.0 (ignores the goal)
  m4:
    topic: /policy/m4/cmd_vel
    kind: policy
    node: policy_node_m4
    debug: /ncp_debug/m4
    description: M4, 32 beams over 180 deg, interface 3.0.0 (steers to the goal)
  m9:
    topic: /policy/m9/cmd_vel
    kind: policy
    node: policy_node_m9
    debug: /ncp_debug/m9
    description: M9, 720 beams over 270 deg, interface 5.0.0 (steers to the goal; trained at the robot's clamps)

sensors:
  # Names below are the previous team's OBSERVED topics on this exact
  # platform (Yahboom X3 Plus + Orin Nano Super, ROS2 Humble), taken from
  # firmware/DOCS/4_robot_start_up.md and cpt_b2_engine.py subscriptions.
  # Confirmed-present unless marked. Still re-verify in Phase 1 — the
  # previous team's own code carries the note "verify with `ros2 topic list`
  # on the flashed Orin before relying on them".
  scan: /scan                              # sensor_msgs/LaserScan, RPLidar A1, 360 deg
  # NOT IN THE OBSERVATION as of interface 2.0.0 (2026-08-12). Listed because
  # they are published and get recorded into bags, not because anything we
  # build subscribes to them. Raw IMU is in imu_link, which is rotated
  # -180/0/-90 from base_link; resolve that before re-adding any of these.
  imu_raw: /imu/data_raw                   # sensor_msgs/Imu — what cpt_b2 used
  imu_filtered: /imu/data                  # sensor_msgs/Imu — Madgwick-fused
  imu_mag: /imu/mag                        # sensor_msgs/MagneticField
  vel_raw: /vel_raw                        # geometry_msgs/Twist — NO header/timestamp
  voltage: /voltage                        # std_msgs/Float32
  camera_color: /camera/color/image_raw
  camera_depth: /camera/depth/image_raw
  point_cloud: /camera/depth/points

  # UNVERIFIED — does not appear in the previous team's documented topic
  # list and they never subscribed to it. If absent, base_velocity in
  # interface.yaml has to come from /vel_raw instead.
  odom: /odom

  # NOTE: /scan is absent from the sanity-check output recorded in
  # firmware/DOCS/4_robot_start_up.md PART 4, even though the grep pattern
  # would have matched it. Most likely the lidar simply was not launched for
  # that capture — cpt_b2_engine definitely subscribes to /scan. Confirm the
  # lidar comes up as part of yahboomcar_bringup and is not a separate launch.

status:
  safety: /safety/status

services:
  safety_kill: /safety/kill
  safety_reset: /safety/reset
