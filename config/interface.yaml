# THE FROZEN CONTRACT — obs/action interface for the ROSMASTER X3 policy pipeline.
#
# STATUS: DRAFT — NOT YET FROZEN.
# This file is filled in during Phase 3, which blocks on Phase 1 measured
# sensor rates. Fields marked TODO(phase1) cannot be chosen until Phase 1
# task 4 (`ros2 topic hz` / `ros2 topic delay`) has been run against the real
# robot. Do not guess them.
#
# Bump `interface_version` on ANY change to observation or action layout.
# The policy node asserts the version embedded in the exported model metadata
# against this value and refuses to start on a mismatch.

interface_version: "1.0.0"

network:
  # CONFIRMED 2026-08-08 from the Jetson host's own login banner:
  #   ROS_DOMAIN_ID: 28 | my_robot_type: x3 | my_lidar: a1 | my_camera: astraplus
  #
  # Not a free choice — the Yahboom drivers run natively on the host and are
  # the source of /scan, /imu/*, /vel_raw and the sink for /cmd_vel, so we
  # join their domain. Matches what the previous team set their container to.
  # Set identically on the workstation and in our container.
  ros_domain_id: 28

  # The previous team needed this on BOTH host and container. Their stated
  # rationale ("bypasses multicast discovery") is not what it does — a custom
  # UDPv4 transport still does multicast. What `useBuiltinTransports: false`
  # actually removes is the SHARED-MEMORY transport, which cannot work across
  # the container boundary. That matches their reported symptom exactly:
  # `ros2 topic list` works (discovery is fine) but `ros2 topic echo` hangs
  # (data transport is not). Same fix, correct reason.
  #
  # Consequence for us: multicast discovery is intact, so plain DDS from the
  # workstation should work without a discovery server.
  fastdds_profile: /root/fastdds_unicast.xml
  fastdds_disables: shared_memory_transport
  fastdds_profile_note: >-
    MEASURED 2026-08-08: that path is owned by root and is NOT readable by
    user `jetson`, who runs the host-side nodes. The previous team's host-side
    fix has therefore never actually been in effect for host nodes — FastDDS
    silently falls back to defaults when the profile file cannot be read.
    Only the in-container copy (also /root, but the container runs as root)
    was ever live.

  # Multicast discovery does NOT work on the lab WiFi. See
  # config/fastdds_unicast_peers.xml for the measurement and the fix.
  discovery: unicast_initial_peers
  discovery_profile: config/fastdds_unicast_peers.xml
  multicast_status: >-
    225.0.0.1 (the group `ros2 multicast send/receive` uses) crosses fine;
    239.255.0.1 (the group FastDDS uses for SPDP discovery) is dropped by the
    access point. Verified with raw sockets in both directions. A passing
    `ros2 multicast receive` is therefore NOT evidence that DDS will work.

control:
  # TODO(phase1): must be at or below the slowest sensor feeding the
  # observation, with headroom. Justify the final choice in
  # docs/interface_contract.md against the Phase 1 numbers.
  #
  # Strong prior from the previous team's stack on this exact hardware:
  # cpt_b2_engine ran its decision cycle at PIPELINE_HZ = 5, with a 200 ms
  # latency target and 400 ms flagged as "very slow". The lidar is an RPLidar
  # A1, which spins at 5.5-10 Hz. So the answer is very likely 5-10 Hz, and
  # anything above 10 Hz would be feeding the policy repeated scans.
  # MEASURED 2026-08-08 from the workstation (see docs/deployment.md §6).
  # The whole Yahboom stack runs at ~10 Hz: /odom 10.74, /imu/data_raw 10.74,
  # /vel_raw 9.22, /voltage 9.05. Nothing sensor-side is faster than ~10 Hz.
  #
  # Still null because the LIDAR rate is unmeasured — the lidar did not start
  # this session (hardware fault, see docs/phase1_session_2026-08-08.md) and
  # it is expected to be the slowest contributor. Decide once /scan is
  # measured. Note 10 Hz control against 10 Hz sensors leaves NO headroom,
  # which is the situation BUILD-PLAN §Phase 3 task 1 warns about; 5 Hz (the
  # previous team's choice) is the conservative option.
  rate_hz: null
  prior_hz: 5   # not a decision — the previous stack's rate, for reference
  measured_source_rates_hz:
    odom: 10.74
    odom_raw: 10.74
    vel_raw: 9.22
    imu_data: 9.41
    imu_data_raw: 10.74
    imu_mag: 10.01
    joint_states: 20.01
    tf: 29.99
    voltage: 9.05
    scan: null   # lidar did not start
  frame_id: base_link

observation:
  # Order is load-bearing. The vector is built in exactly this order by the
  # shared schema loader; nothing hand-writes this ordering a second time.
  layout:
    - name: lidar_ranges
      source_topic: /scan
      shape: [36]
      units: dimensionless   # normalized; raw source is meters
      preprocessing: >-
        Operator decision: use the forward 180 deg arc only, min-pooled into
        36 bins of 10 deg each (nearest obstacle per sector — min, NOT mean,
        so a narrow obstacle is never averaged away). Drop self-occlusion
        rays FIRST, then clip to [range_min, range_max], then replace
        non-finite returns (inf/NaN, i.e. no-return) with range_max, then
        min-pool, then divide by range_max giving [0, 1].
      # TODO(phase1): from the datasheet of the lidar actually fitted, cross
      # checked against the range_min/range_max fields of a live LaserScan.
      range_min_m: null
      range_max_m: null
      arc_deg: 180
      bin_deg: 10
      pooling: min

      # The sensor itself is a 360 deg RPLidar A1 (confirmed from the previous
      # team's cpt_b2_engine, which decomposed full FRONT/RIGHT/REAR/LEFT
      # sectors and used the rear one for reverse-motion obstacle avoidance).
      # Restricting to the forward 180 deg is our deliberate choice, not a
      # hardware limit — the rear half is discarded, not absent. Widening the
      # arc later is an interface_version bump.
      sensor: rplidar_a1
      sensor_fov_deg: 360
      scan_convention: index 0 at angle_min; angle = angle_min + i*angle_increment

      # Rays that hit the robot's own body. These MUST be dropped before
      # pooling: a min-pool over a bin containing a self-hit returns the
      # distance to the robot's own chassis, i.e. a permanent phantom
      # obstacle, and the e-stop would latch the moment it is enabled.
      #
      # Values below are the previous team's, calibrated 2026-02-23 on this
      # platform. TODO(phase1): re-verify on OUR unit from a static diagnostic
      # scan in open space — mounting differs between builds.
      #
      # Note the first zone straddles 0 deg (the Astra Pro camera body sits
      # directly in front of the lidar). That is dead centre of our forward
      # arc and lands in the most safety-critical bin.
      self_occlusion_zones_deg:
        - [-6.0, 6.0]      # Astra Pro camera body, directly ahead
        - [18.0, 24.0]     # cable/bracket at ~20 deg
        - [38.0, 41.0]     # structure at ~39 deg
      # At 10 deg bins over [-90, +90] none of the three zones covers a whole
      # bin (the widest, -6..+6, takes 60% of the two bins adjacent to 0), so
      # every bin retains valid rays. That must be ASSERTED, not assumed:
      #   - a bin left with zero valid rays after masking is a sensor fault,
      #     not "clear". The observation builder returns None and the safety
      #     layer treats it as a stale scan -> e-stop. Filling it with
      #     range_max would be fail-OPEN and is forbidden.
      empty_bin_policy: fault   # never range_max — that would be fail-open

    - name: base_velocity
      # RESOLVED 2026-08-08: /odom DOES exist. yahboomcar_bringup_X3_launch.py
      # includes a robot_localization EKF (ekf_x1_x3_launch.py) which fuses
      # wheel encoders with the IMU and publishes /odom plus the odom->base_link
      # TF. The previous team simply never used it.
      #
      # /odom is chosen over /vel_raw because nav_msgs/Odometry carries a
      # header/timestamp and a bare geometry_msgs/Twist does not. Fail-closed
      # staleness detection needs a source timestamp — arrival time at the
      # subscriber cannot tell a stalled driver from a stalled network.
      source_topic: /odom
      source_topic_type: nav_msgs/Odometry
      subfield: twist.twist
      measured_rate_hz: 10.74
      qos: {reliability: RELIABLE, durability: VOLATILE}
      child_frame_id: base_footprint
      source_note: >-
        EKF-fused, not raw encoder output. /odom_raw and /vel_raw carry the
        unfused encoder velocity if that turns out to be preferable — but
        /vel_raw has no timestamp. TODO(phase1): confirm measured rate.
      shape: [3]             # vx, vy, wz — mecanum, lateral DOF is real
      units: [m/s, m/s, rad/s]
      preprocessing: none    # raw physical units, see normalization note below
      staleness_warning: >-
        A bare Twist has no timestamp. If we end up on /vel_raw, staleness
        must be tracked by arrival time at the subscriber, which cannot
        distinguish a stalled driver from a stalled network. Prefer /odom.

    - name: imu_angular_velocity
      # RESOLVED 2026-08-08: /imu/data is produced by imu_filter_madgwick,
      # launched as part of yahboomcar_bringup_X3_launch.py, from /imu/data_raw.
      # So /imu/data IS fused and /imu/data_raw is the unfiltered sensor.
      #
      # We stay on /imu/data_raw (also the previous team's choice): the
      # observation wants raw angular velocity and linear acceleration, and
      # Madgwick's value is in the orientation quaternion, which we do not use.
      # Feeding filtered inertial channels would add lag we cannot characterise.
      # TODO(phase1): confirm measured rates for both.
      source_topic: /imu/data_raw
      source_topic_alternatives: [/imu/data]
      subfield: angular_velocity
      shape: [3]             # x, y, z
      units: [rad/s, rad/s, rad/s]
      preprocessing: none

    - name: imu_linear_acceleration
      source_topic: /imu/data_raw
      source_topic_alternatives: [/imu/data]
      subfield: linear_acceleration
      shape: [3]             # x, y, z
      units: [m/s^2, m/s^2, m/s^2]
      preprocessing: none

    - name: previous_action
      source_topic: null     # internal node state, not a subscription
      shape: [3]             # the previous cmd_vx, cmd_vy, cmd_wz, post-tanh
      units: dimensionless   # [-1, 1], as emitted by the network
      preprocessing: none
      note: >-
        The action the policy itself last emitted, in network output space
        (pre-scaling). On the first cycle, and after any reset, this is zeros.
        It is NOT read back from /cmd_vel — the safety layer may have clamped
        that, and feeding the clamped value back would silently change the
        observation distribution relative to training.

  total_dim: 48              # 36 + 3 + 3 + 3 + 3
  dtype: float32

  normalization:
    # No policy has been trained yet, so no learned normalizer exists.
    # The lidar block carries a fixed /range_max scaling (declared above).
    # Velocity and IMU components are deliberately left in raw physical
    # units — placeholder statistics are NOT to be fabricated.
    scheme: fixed_lidar_only
    stats_source: null
    note: >-
      When training begins and a running mean/std normalizer is used, its
      statistics are exported alongside the ONNX model and loaded by the
      inference node. See the marked hook in
      src/rm_policy/rm_policy/observation_builder.py. Adding it is an
      interface_version bump.

action:
  layout:
    - name: cmd_vx
      range: [-1.0, 1.0]
      units: dimensionless   # network output, tanh
    - name: cmd_vy
      range: [-1.0, 1.0]
      units: dimensionless
    - name: cmd_wz
      range: [-1.0, 1.0]
      units: dimensionless
  total_dim: 3
  dtype: float32
  activation: tanh

  scaling:
    # Maps network output [-1, 1] to physical units: physical = output * max.
    # PROVISIONAL and deliberately conservative, matching the safety layer's
    # "start low" principle. To be raised only after Phase 2 safety validation
    # is signed off in docs/safety_validation.md. Not final.
    vx_max: 0.3   # m/s
    vy_max: 0.3   # m/s
    wz_max: 0.5   # rad/s
    provisional: true

coordinate_frames:
  # MEASURED 2026-08-08 from the live TF tree.
  # Tree: odom -> base_footprint -> base_link -> {imu_link, camera_link, laser_link}
  tree: odom -> base_footprint -> base_link -> {imu_link, camera_link, laser_link}

  base_link:
    definition: Robot body origin. Child of base_footprint.
    axes: REP-103 — x forward, y left, z up.
  odom:
    definition: EKF odometry frame (robot_localization). Continuous, drifts.
    note: /odom child_frame_id is base_footprint, NOT base_link.
  laser_link:
    definition: Lidar optical center.
    # NOTE the frame is `laser_link`. sllidar_launch.py defaults frame_id to
    # `laser`, which is NOT in the TF tree — launch it with
    # frame_id:=laser_link or every scan is untransformable and RVIZ shows
    # nothing.
    transform_from_base_link:
      translation_m: [0.043, 0.000, 0.110]
      rotation_rpy_deg: [0.0, 0.0, 0.0]
    note: >-
      No rotation, so lidar 0 deg == robot forward and our forward-180 arc maps
      directly onto scan angles with no offset. 4.3 cm forward, 11 cm up.
  imu_link:
    definition: IMU sensing origin.
    transform_from_base_link:
      translation_m: [-0.060, 0.010, 0.010]
      rotation_rpy_deg: [-180.0, 0.0, -90.0]
    # ============================================================
    # THE IMU IS ROTATED RELATIVE TO base_link. Roll 180 deg, yaw -90 deg.
    # /imu/data_raw angular_velocity and linear_acceleration are expressed in
    # imu_link, so their axes do NOT correspond to base_link's x-forward,
    # y-left, z-up. Feeding them into the observation unrotated silently
    # mislabels the axes: base_link x-forward acceleration appears on a
    # different IMU component, and the sign of at least one axis flips.
    #
    # TODO(phase3): decide and implement ONE of
    #   (a) rotate imu vectors into base_link in observation_builder, or
    #   (b) declare the observation IMU block to be in imu_link and keep it
    #       consistent between training and deployment.
    # (a) is preferred — every other observation component is base_link-ish,
    # and a mixed-frame observation vector is a trap for whoever trains next.
    # Whichever is chosen must be stated here explicitly before freezing.
    # ============================================================
    observation_frame_unresolved: true
