# roam.yaml — limits for policy_node's ROAM mode: the node draws its own next
# goal, at random in free space, each time it reaches the current one or
# gives up on it. THE AUTHORITY for every number roam uses. A missing key
# refuses to start.
#
# WHAT THIS IS FOR: "set waypoints at random and let it run". A policy is
# exercised leg after leg without an operator clicking a goal each time, and
# a goal the robot never reaches is dropped instead of being held forever.
#
# WHAT IT IS NOT: roam only moves the goal. The policy proposes exactly as it
# does for an operator goal, behind the same clamps, watchdogs and kill. Roam
# adds no command authority and no retry. It looks at the lidar ONLY to keep
# the next goal out of walls; it does not steer, and the policy's obstacle
# avoidance is what it is. RUN ROAM WITH BOTH LIDAR ZONES ON
# (stop_zone_enabled:=true slow_zone_enabled:=true): the launch defaults
# them off, and on 2026-10-23 the first live run drove into a wall behind a
# blind-drawn goal with nothing between the goal and the wall but KILL.
# Read with docs/roam.md.
#
# Policy-agnostic: M4 steers to the goal, so these are real waypoints. M8-v2
# ignores the goal, so for it roam only keeps the arrival latch from ending
# the run and resets the recurrent state at each hand-off.

roam:

  # ---- where the next goal is drawn: ROBOT frame at the hand-off instant ----
  # Distance, metres, uniform in [range_min_m, range_max_m].
  # 0.6: the arrival latch is goal_reached_dist (0.4 m, the training
  #      SUCCESS_DIST), so the shortest leg moves the robot at least 0.2 m.
  #      policy_node refuses to start with range_min_m <= goal_reached_dist:
  #      such a goal would hand off every dwell_s without driving. Short
  #      legs are what get the robot out of clutter: at its first goal on
  #      2026-10-23 it sat with objects 0.41 m to both sides and 1.0 m
  #      ahead, and no 1.0 m leg was free in any direction
  #      (tests/fixtures/tg30_roam_hold_scan.yaml); a 0.6 m leg ahead was.
  range_min_m: 0.6
  # 2.5: the static default goal (interface.yaml goal_default_m, operator
  #      decision 2026-08-27), chosen to sit inside the odometry drift budget.
  #      Pinned <= goal_default_m by a test.
  range_max_m: 2.5

  # Bearing, degrees, uniform in [-cap, +cap]; 0 is dead ahead, + is left.
  # 45: both trained policies only ever saw goals AHEAD (BARN's goal is 10 m
  #     straight down the corridor), and M4 goes off-distribution once the
  #     goal is behind. At the shortest leg and widest bearing (1.0 m, 45 deg)
  #     the normalised goal x is 0.71/5 - 1 = -0.86, inside the -0.92 floor
  #     BARN produced (CLAUDE.md 2026-10-13). A wider cap is for a policy
  #     trained on random goal bearings.
  bearing_cap_deg: 45.0

  # ---- the draw must land in free space the lidar can see -----------------
  # The strip from the robot to the goal, extended by clearance_m and
  # corridor_half_width_m wide, must hold no lidar return.
  # 0.20: the X3's half-width (~0.13 m) plus margin for the policy's wander.
  corridor_half_width_m: 0.20
  # 0.3: enough for the 0.4 m latch to close before a wall does, with the
  #      stop zone (0.15 m, ON for roam) behind it. 0.5 left the robot above
  #      with no free leg at all.
  clearance_m: 0.3
  # No-return rays (the TG30's 0.0 sentinel, ~30% of rays) are UNKNOWN, not
  # free: a candidate needs at least this fraction of the rays over its strip
  # to be valid, or it is refused.
  min_valid_fraction: 0.5
  # Returns closer than this are the robot's OWN BODY, not obstacles: the
  # lidar's standoffs at 0.07 m and the chassis corners at 0.19-0.23 m show
  # in every TG30 scan (tests/fixtures/tg30_roam_hold_scan.yaml). A 0.07 m
  # return lies inside the strip of every bearing within 90 deg of it, so
  # counting them blocked the whole circle on 2026-10-23. A real object this
  # close is touching the robot, and the stop zone owns that.
  self_radius_m: 0.25
  # Random candidates per hand-off, then as many bearings at the shortest
  # leg. If none is free the node HOLDS the current goal (last_reason
  # no_free_goal, counted in held) and retries once a second: a boxed-in
  # robot waits instead of being sent through a wall. Jog it out.
  draw_attempts: 32

  # ---- when the next goal is drawn --------------------------------------
  # Seconds to hold zero after arrival before the next goal. rm_safety's
  # acceleration limiter (max_ax 0.75) brings 0.25 m/s to rest in ~0.33 s;
  # 1 s means the robot is physically stopped and the arrival is visible on
  # the dashboard and in a bag (5 ticks of goal_reached), so an "arrived"
  # hand-off is distinguishable from an operator re-target.
  dwell_s: 1.0

  # Give up on a goal the robot is not closing on: if the distance to the
  # goal has not shrunk by progress_min_m within progress_window_s, the goal
  # is abandoned (reason stalled). The same rule as rm_waypoint's progress
  # watchdog, and it is what ends a push against a wall or a stop-zone hold.
  # 10 s, not rm_waypoint's 6 s: a 45 deg turn at the policy's clamped yaw
  # rate takes ~3-4 s before any distance closes. Counted as `stalls`.
  progress_window_s: 10.0
  progress_min_m: 0.05

  # The hard ceiling on one goal, whatever happens. The farthest leg is
  # 2.5 m, 10 s at the 0.25 m/s clamp, and M4's heading converges ~4x slower
  # than its dynamics expect under the uniform clamp. Every hand-off log line
  # carries the elapsed seconds: set this from a real run. Counted as
  # `timeouts`. While the robot is KILLED these clocks still run and the
  # counters climb: read them over an armed window.
  timeout_s: 30.0

  # ---- the retreat: back out of a stop-zone e-stop ------------------------
  # With both zones on, a robot that creeps to within stop_zone_m of a wall
  # is latched and, until 2026-10-23, stuck until a human moved it. Now
  # rm_safety passes one thing under the latch, a fresh pure straight
  # reverse (safety_limits.yaml estop.retreat_*), and releases the latch on
  # its own after N ticks of that reverse with a clear scan. policy_node
  # sends that reverse (rm_policy/retreat.py) when roam is on and it is the
  # selected source, then roam draws the next goal from where the robot
  # stands. The rear is unmonitored: a BLIND reverse the operator accepts
  # for a static scene with KILL in hand, never unattended.
  # 0.12: the reverse speed requested; rm_safety caps it at its own
  #       retreat_max_vx (0.12, the only tape-measured reverse speed) and a
  #       test pins this at or under both that and max_vx.
  retreat_vx: 0.12
  # 0.3: how far back counts as done even if the latch has not released
  #      (a lateral obstacle keeps the wide arc busy). Twice the stop
  #      radius, inside the corridor the forward leg was drawn through.
  retreat_m: 0.3
  # 8 s: 0.3 m takes 2.5 s at 0.12 m/s; a retreat still latched after 8 s
  #      is wheels that did not move, dry_run, or an obstacle along the
  #      side. Then the node holds the goal and warns.
  retreat_timeout_s: 8.0
  # 20 s between retreats, and at most one per goal: retreat, release,
  # drive back into the same wall, retreat is the unattended loop
  # rm_waypoint's "never retry" rule exists to prevent.
  retreat_cooldown_s: 20.0

  # Seed for the node's own random generator. Every policy node seeds its own
  # generator from this, so two nodes draw the SAME sequence of candidates
  # (their goals still differ: each hands off at its own moments and sees its
  # own scan) and a run is reproducible. Change it for a different course.
  seed: 0
