# Safety layer limits — clamps, e-stop zones, timeouts.
#
# THERE IS NO PHYSICAL E-STOP ON THIS UNIT. The software kill switch
# (/safety/kill) is the only stop mechanism, with battery disconnect as the
# last resort. Every value here is therefore set deliberately low. Raising
# any of them requires Phase 2 safety validation to be signed off in
# docs/safety_validation.md, with date and operator.
#
# Consumed by rm_safety. No value here may be duplicated as a literal in node
# code — everything is loaded from this file.

velocity_limits:
  # Absolute caps applied to every command regardless of source. These are at
  # or below the action scaling in interface.yaml so the safety layer is
  # always the tighter of the two.
  # RAISED 2026-08-29 (operator request, to make the NCP debug test readable
  # at a useful pace). 0.15 -> 0.25 returns this to its pre-2026-08-14 value.
  #
  # THIS IS AHEAD OF THE PHASE 2 HARDWARE SIGN-OFF. BUILD-PLAN gates raising
  # these clamps on safety_validation.md §3, whose hardware rows are still
  # unsigned. Revert to 0.15 / 0.4 for any unattended or long-running use.
  #
  # Stopping distance at 0.25 m/s, which is what makes it defensible:
  #   braking            v^2/(2*max_ax) = 0.0625/1.5      = 0.042 m
  #   detection lag      3 scans @ 10 Hz = 0.3 s @ 0.25   = 0.075 m
  #   total                                              ~= 0.117 m
  # against a slow->stop band of 0.65-0.35 = 0.30 m, so ~2.5x margin. That
  # band was widened back from 0.50 in the same change specifically to pay
  # for this speed; do not raise max_vx again without redoing this sum.
  max_vx: 0.25          # m/s   — forward/back
  max_vy: 0.25          # m/s   — lateral (mecanum; do not omit — see below)
  # 0.4 -> 0.8. Yaw is the cheaper axis to raise: it closes no distance to an
  # obstacle, and slow-zone scaling deliberately does not throttle it (see the
  # 2026-08-14 yaw fix), so a faster spin does not erode the stopping margin
  # computed above. It is also the axis the debug rule spends most of its time
  # commanding, so this is what actually makes the test watchable.
  max_wz: 0.8           # rad/s — yaw

  # max_vy is deliberately RETAINED after interface 2.0.0 dropped vy from the
  # policy's action space. The safety layer clamps every source, and
  # /teleop/cmd_vel is also a source — an operator may legitimately strafe
  # while repositioning the robot. The base is still mecanum and the driver
  # still accepts linear.y.
  #
  # So: the policy emitting vy = 0 is a property of the POLICY NODE, not of
  # the safety layer, and the two must not be collapsed. Deleting lateral
  # handling here because "the policy doesn't strafe any more" would leave the
  # teleop path unclamped on an axis the robot can physically drive.
  #
  # A non-zero linear.y arriving on /policy/cmd_vel is a BUG, not a command:
  # the policy has no vy output. Zero it and log a warning rather than
  # clamping it silently — silent clamping would hide a real interface
  # mismatch (e.g. a stale 3-dim model loaded against a 2-dim contract).
  policy_vy_expected: 0.0
  policy_vy_violation_action: zero_and_warn

acceleration_limits:
  # Clamped by comparing against the last published command and elapsed time.
  # This is what protects the STM32 and the drivetrain from step commands.
  max_ax: 0.75          # m/s^2 — raised from 0.5, 2026-08-14 operator decision
                        # (paired with the max_vx drop to 0.15 m/s above: at
                        # 0.75 m/s^2 the robot still reaches full commanded
                        # speed in 0.2 s, well within one consecutive-scan
                        # noise-filter window at 5 Hz).
  max_ay: 0.5           # m/s^2
  max_alpha_z: 1.0      # rad/s^2

estop:
  # Two-tier lidar zones, measured on the rolling minimum range within the
  # monitored arcs. Rear arc is chassis-occluded and carries no signal, so it
  # is not monitored — the robot must be treated as blind behind.
  # 0.80 -> 0.50 -> 0.65, both moves on 2026-08-29.
  #
  # First to 0.50, paired with dropping the debug policy's obstacle_dist from
  # 1.5 m to 0.9 m: at 0.80 the safety layer was scaling velocity down while
  # the policy still thought it was cruising, so the robot crawled.
  #
  # Then back out to 0.65 when max_vx was raised 0.15 -> 0.25, to pay for the
  # longer stopping distance (see the sum above max_vx). 0.50 would have left
  # a 0.15 m band against ~0.12 m of braking + detection lag — almost no
  # margin. These two numbers are coupled: RAISING max_vx REQUIRES widening
  # this, and narrowing this REQUIRES lowering max_vx.
  #
  # The three thresholds must stay ordered so the POLICY reacts before the
  # SAFETY layer has to:
  #     0.90 m  policy spins away         (upstream obstacle_dist)
  #     0.55 m  safety starts scaling     (this)
  #     0.35 m  safety zeroes and latches (stop_zone_m)
  #
  # Unaffected by either move: the chassis standoffs at ~0.48-0.54 m sit
  # inside self_occlusion_zones_deg below and are dropped before the arc
  # check, so they cannot straddle any of these boundaries.
  # 0.80 -> 0.50 -> 0.65 -> 0.55. The last move, 2026-08-29 (operator): the
  # slow zone was still throttling too early once the arc was narrowed to a
  # forward cone. Sized against the stopping sum rather than picked:
  #     braking          v^2/(2*max_ax) = 0.0625/1.50      = 0.042 m
  #     3-scan filter    max_vx * 3/scan_hz = 0.25 * 0.30  = 0.075 m
  #                                                  total = 0.117 m
  #     band at 0.55     0.55 - 0.35                       = 0.200 m  (1.71x)
  # 0.50 was considered and rejected: its 0.150 m band is only 1.29x, which is
  # the same thin margin that got 0.50 reverted once already on 2026-08-29.
  #
  # COUPLED TO slow_forward_arc_deg BELOW, not just to max_vx. The cone must
  # still subtend the robot's width at THIS radius: 0.55 * tan(15 deg) =
  # 0.147 m against a ~0.13 m half-extent in the scan plane (from the ~0.26 m
  # measured chassis extent, see self_occlusion_zones_deg). Reducing this
  # radius further REQUIRES widening the cone to compensate, or the slow zone
  # stops covering the robot's own width.
  slow_zone_m: 0.55     # scale commanded velocity down proportionally
  # 0.35 -> 0.15, operator decision 2026-08-29. Band is now 0.40 m against
  # 0.117 m of stopping distance (3.4x), so the margin is not the constraint.
  # WHAT IS: 0.15 m is measured from the LIDAR, and the chassis standoffs
  # read 0.106-0.125 m (see self_occlusion_zones_deg). Those are masked, but
  # the gap between the mask and this threshold is now ~2.5 cm — any chassis
  # return that falls outside the masked sectors latches the e-stop
  # immediately. That was the 2026-08-14 permanent-latch bug.
  stop_zone_m: 0.15     # zero velocity and LATCH
  forward_arc_deg: 90   # centered on +x. THE STOP ZONE'S ARC, and the default
                        # for the slow zone when the two keys below are unset.

  # ------------------------------------------------------------------
  # SLOW-ZONE ARCS — separate from the stop zone's, added 2026-08-29.
  #
  # WHY THEY EXIST: one arc pair used to serve both zones, so returns from
  # walls and furniture BESIDE the robot scaled forward velocity down even
  # with a completely clear path ahead. Narrowing the shared arc would have
  # fixed that by also narrowing the STOP zone — trading a comfort problem
  # for a real reduction in protection. Splitting them means the slow zone
  # can be a narrow forward cone while the stop zone keeps full coverage.
  #
  # 30 deg total = +-15 deg. Chosen to match the SWEPT PATH at the slow
  # radius: 0.65 * tan(15 deg) = 0.174 m of lateral coverage, i.e. a little
  # over the robot's half-width. That is the right criterion for a slow zone
  # — it should react to things the robot is about to drive INTO, not things
  # it is driving PAST.
  #
  # DO NOT apply the same 30 deg to forward_arc_deg above. At the 0.35 m stop
  # radius, +-15 deg covers only 0.35 * tan(15 deg) = 0.094 m either side —
  # NARROWER THAN THE ROBOT. The stop zone must stay wide, and the from_dict
  # validation enforces that these never exceed it.
  #
  # A cone is an approximation of the real shape, which is a rectangular
  # corridor of the robot's width: a fixed angle is too narrow close in and
  # too wide far out. It is good enough at one radius, and the slow zone has
  # one radius. If this ever needs to be right across a range, replace the
  # angular test with a lateral-offset test (|r*sin(theta)| < half_width).
  #
  # NOT YET VALIDATED AGAINST A RECORDED RUN. The intent came from an
  # operator observation that the robot throttled unnecessarily; the replay
  # tier can score this geometry against real scans once a run is captured
  # (scripts/record_run.sh).
  slow_forward_arc_deg: 30    # +-15 deg. Omit or null => same as forward_arc_deg.
  slow_lateral_arc_deg: 0.0   # DISABLED. 0.0 is meaningful and is NOT null:
                              # it turns lateral monitoring off for the SLOW
                              # zone only. Lateral returns are exactly what
                              # was causing the spurious throttling, and the
                              # robot does not command lateral motion under
                              # the policy. The STOP zone keeps its full
                              # lateral_arc_deg below, so a lateral obstacle
                              # can still stop the robot — it just no longer
                              # slows it.
  lateral_arc_deg: 60   # each side. Retained after interface 2.0.0: the policy
                        # no longer commands lateral motion, but teleop can,
                        # and the robot can still be pushed or drift sideways
                        # on mecanum rollers. Monitoring is not conditional on
                        # the policy's action space.
                        #
                        # Full 60 deg restored 2026-08-14 — self-occlusion is
                        # now handled by self_occlusion_zones_deg below
                        # instead of shrinking real coverage. See that key's
                        # comment for the measurement and rationale.

  # Rays that hit the robot's own chassis. Mirrors interface.yaml's lidar
  # observation mask (self_occlusion_zones_deg there), but independent of it
  # — min_range_in_arcs() has its own arc definition (forward_arc_deg +
  # lateral_arc_deg) and previously had NO occlusion masking at all.
  #
  # MEASURED 2026-08-14: two symmetric chassis standoffs read stable, real
  # (non-zero) returns well inside the 0.35 m stop zone, confirmed across 5
  # independent scans in an open room with nothing else within 1 m, and
  # present both before and after repositioning the robot (angle/range
  # unchanged by moving the robot -> self-hit, not an environmental object):
  #   LEFT  standoff: ~97 to 118 deg,  range ~0.25-0.26 m
  #   RIGHT standoff: ~-108 to -130 deg, range ~0.106-0.125 m
  # Both fall inside the old unmasked 60-120 deg lateral bands, so
  # min_range_in_arcs() always saw < stop_zone_m there. latching: true means
  # the estop triggered within consecutive_scans_to_trigger of every launch
  # and never cleared -- /safety/reset re-latches immediately whenever
  # is_stop_zone is still true, which it always was. This is what made the
  # robot appear permanently stuck after every reset attempt.
  #
  # A symmetric narrowing of lateral_arc_deg was tried first and rejected:
  # clearing both standoffs that way required shrinking to ~10-12 deg total,
  # which would have gutted real lateral obstacle coverage on both sides to
  # work around a mounting artifact on both sides. This explicit mask keeps
  # the full 60 deg lateral arc everywhere except the standoffs themselves.
  #
  # Zones given ~5 deg of margin beyond the measured extent (widened from an
  # initial ~2-3 deg pass after safety review flagged it as too tight against
  # measurement jitter: angle varied ~1 deg scan-to-scan, plus the TG30's
  # 0.178 deg angular quantization -- a standoff edge landing outside a
  # too-tight mask would silently reproduce the exact permanent-latch bug
  # this fix exists to solve. No coverage cost to widening further here,
  # since this whole sector was already a dead zone (the beam terminates on
  # the standoff at any range, so there was no real detection capability to
  # give up). Format matches interface.yaml: list of [lo_deg, hi_deg] pairs,
  # NOT wrapping across +-180 (neither zone needs to). A ray inside any zone
  # is dropped before the forward/lateral arc check, exactly like the lidar
  # observation mask -- this is occlusion removal, not "treat as clear": if
  # the ONLY returns in a monitored arc happen to be masked ones, the
  # monitored zone correctly falls back to no-signal-in-zone (not an
  # obstacle), never to a phantom "no obstacle" verdict.
  #
  # NOTE: this is a SEPARATE mask from config/interface.yaml's
  # self_occlusion_zones_deg (the lidar OBSERVATION pipeline's forward-180
  # mask, currently empty -- see that file's 2026-08-14 note). The two
  # configs monitor different arcs for different purposes and do not
  # interact; do not conflate them.
  #
  # RIGHT WIDENED 2026-08-14 (same session, operator decision): the first
  # pass ([-132,-105], then margin-widened to [-135,-103]) still left
  # -99 to -103 deg exposed. A second close feature was found there, live,
  # while chasing a permanently-relatching e-stop: ~-99.3 to -101.9 deg,
  # ~0.48-0.54 m, hovering close enough to the 0.35 m stop_zone_m boundary
  # that ordinary reading jitter pushed it under the threshold on roughly
  # half of all control ticks, re-latching instantly on every reset. The
  # LEFT side has the same feature, mirrored (measured ~97.1-100.2 deg, down
  # to 0.217 m) but was already inside the existing [92,123] LEFT zone.
  # Operator confirmed nothing is physically present at either location and
  # asked to mask the whole remaining sector back to the standoffs rather
  # than keep chasing individual close readings one at a time. RIGHT widened
  # from -103 to -97 (matching LEFT's 92 deg margin, mirrored) to bring both
  # sides to parity; a small residual asymmetry ([92,123] vs [-135,-97], 31
  # vs 38 deg wide) is left as-is rather than hand-tuned further without
  # another live measurement pass.
  self_occlusion_zones_deg:
    - [92.0, 123.0]     # LEFT standoff (measured ~97.1-118 deg)
    - [-135.0, -97.0]   # RIGHT standoff + adjacent close feature (measured
                         # ~-99.3 to -130 deg)
  consecutive_scans_to_trigger: 3   # noise filter; a single bad return must
                                    # never latch a stop
  latching: true        # once stopped, stays stopped until /safety/reset

  # ------------------------------------------------------------------------
  # ZONE MASTER SWITCHES — both must stay `true` for the e-stop to be whole.
  #
  # Added 2026-08-30 at operator request: the slow zone's velocity scaling
  # and the stop zone's latch were interfering with evaluating the trained
  # policy, which cannot demonstrate obstacle avoidance if the layer beneath
  # it brakes first. Approved by the operator as a deliberate, temporary
  # override for supervised policy evaluation.
  #
  # READ THIS BEFORE SETTING EITHER TO false:
  #
  #   These are the ONLY obstacle-based protection on this robot, and there
  #   is NO PHYSICAL E-STOP. With stop_zone_enabled false, NOTHING in this
  #   stack stops the robot before a collision. The velocity clamps bound
  #   SPEED, not PROXIMITY — the robot hits the wall at max_vx instead of at
  #   2 m/s. That is a smaller impact, not the absence of one.
  #
  # What is NOT affected, and stays fully active either way:
  #   * every velocity clamp (max_vx / max_vy / max_wz)
  #   * every acceleration limit
  #   * the policy vy violation check
  #   * /safety/kill, and killed-on-startup
  #   * the command / scan / odom staleness watchdogs
  #
  # So /safety/kill remains the operator's stop, and a dead lidar or a silent
  # policy still stops the robot. Only "an object is N metres ahead" stops
  # being acted on. min_range is still MEASURED and still published on
  # /safety/status, so the dashboard shows proximity throughout — it simply
  # does not brake on it.
  #
  # Composition: the effective setting is (this value) AND (the launch
  # parameter of the same name). Both default true and either can disable;
  # neither can re-enable what the other switched off. Startup-only — a
  # `ros2 param set` is REJECTED, so no browser can switch the e-stop off
  # mid-run.
  #
  # Turning them back on is the whole-stack default: revert these to true
  # (or simply stop passing the launch arguments) and restart.
  # ------------------------------------------------------------------------
  slow_zone_enabled: true   # false -> no proximity velocity scaling
  stop_zone_enabled: true   # false -> NO E-STOP AND NO LATCH. Read above.

timeouts:
  command_timeout_ms: 300    # no command on the active input -> publish zero
  scan_timeout_ms: 500       # stale /scan -> treat as e-stop; safety cannot
                             # be guaranteed without perception
  odom_timeout_ms: 500

startup:
  # With no physical E-stop, killed-on-startup is mandatory, not a fallback.
  # The robot must never be able to move as a side effect of a node launching.
  start_killed: true
  persist_kill_state: true
  kill_state_path: /var/lib/rm_safety/kill_state

publishing:
  status_rate_hz: 10
  # When killed, publish zero velocity CONTINUOUSLY rather than going silent:
  # a downstream stale-command watchdog may not exist.
  zero_publish_rate_hz: 20
