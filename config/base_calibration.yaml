# Open-loop base driver calibration — consumed by rm_base.base_node.
#
# This is a CALIBRATION, not a controller. rm_base drives the wheels open
# loop (raw PWM, no encoder feedback) because bernard-1's firmware speed PID
# is unusable (see base_node.py docstring / CLAUDE.md 2026-08-28). Every
# TUNED WHEELS-DOWN AGAINST A TAPE MEASURE on bernard-1, 2026-08-29, in
# control_mode:=closed_loop. Verified end results:
#   straight  — commanded 1.00 m, measured 1.00 m, visually straight
#   turn      — commanded 180 deg, achieved 172 deg, 4 mm off the spot
# Previous values were wheels-UP guesses and were badly wrong (see below).
#
# PWM values are Rosmaster `set_motor` units, [-100, 100], dimensionless.

# Yaw lever arm. The physical half-wheelbase+half-track is 164.555 mm
# (firmware bsp_motion.h MECANUM_MINI_APB), but this is deliberately NOT that
# number: commanding 180 deg with the wheels running at exactly the speed the
# geometry asks for produced only 139 deg, because mecanum rollers scrub
# sideways when turning on the spot. 0.165 * (180/139.3) = 0.213 makes the
# commanded angle come out right.
#
# It is a scrub compensation, not a measurement — do not "correct" it back to
# the physical value. It affects turning only; straight-line driving has no
# yaw component and is unaffected.
#
# 2026-08-29 s3, velocity_accuracy.py: 0.213 -> 0.236 -> 0.227.
# 0.236 OVERSHOT (wz 0.60 gave ratio 1.060, i.e. 184 deg for 173.5 commanded),
# which together with 0.213's 0.904 brackets 1.000 at lever 0.227. That is the
# value here; it is an interpolation between two measured runs, not a new fit.
#
# The measurements behind all of it. At lever 0.213, achieved/
# commanded yaw of 0.780 at wz 0.30, 0.904 at wz 0.60, 0.721 at wz -0.30 —
# while the straight legs came out 1.000/0.992/1.016 over the SAME wheel-speed
# range (a spin at wz 0.30 asks each wheel for wz*lever_arm_m = 0.064 m/s,
# i.e. the 0.06 m/s straight leg). The wheels therefore hit their commanded
# speed and the shortfall is scrub, not calibration.
#
# SCRUB IS SPEED-DEPENDENT AND THIS IS ONE CONSTANT, so it cannot be right
# everywhere. Fitted at wz 0.60 because max_wz is 0.8 and the debug rule
# saturates it, so real spins live at the top of the range. EXPECT wz ~0.30 TO
# STILL UNDER-ROTATE by ~20%; that is inherent to a single constant, not a
# regression to chase. Raising this to fix wz 0.30 would badly over-rotate
# wz 0.60 — at lever 0.236 the 0.30 legs still only reached 0.815 / 0.733
# while 0.60 had already overshot to 1.060.
#
# WHY one constant cannot cover the range: fitting all six measured legs gives
# achieved_yaw_rate ~ 311 * (wheel_speed - 0.025 m/s), i.e. an effective
# ROTATIONAL DEAD-BAND — about the first 0.107 rad/s of any commanded spin is
# lost to scrub before the chassis turns at all. lever_arm_m is a pure
# multiplier and a multiplier cannot cancel an offset. Fixing the whole range
# needs an affine yaw term (gain + per-direction dead-band), the same shape as
# dead_pwm/gain one level up. Not done: no trained policy commands low wz yet.
#
# Measured CW/CCW asymmetry, two samples each at |wz| 0.30: CCW 0.797 vs CW
# 0.727, a 9.7% gap. Consistent in sign across both calibrations. Suspected
# cause is front-right's direction-dependent stiction (breakaway 60 fwd /
# 55 rev), which a spin drives one way for CCW and the other for CW.
lever_arm_m: 0.227

# Encoder scale for the /vel_raw reconstruction. BOTH of these were wrong, and
# the errors partly cancelled, which is why the fault hid for so long: the
# reported speed came out ~1/3 too high, the closed loop held the wheels at
# that wrong speed perfectly, and the robot travelled 0.75 m when asked for
# 1.00 m. Only a tape measure could catch it — odometry cannot check itself.
#
# wheel_circumference_m: the wheel measures 79 mm across with a ruler, so one
# turn is 3.1416 * 0.079 = 0.248 m. The old 0.204 was an unmeasured guess.
#
# counts_per_rev: fitted so reported distance matches the tape (two rounds:
# 1320 -> 2140 -> 2360). The old 1320 assumed 30 gear * 11 PPR * 2 edges *
# 2 channels. 2360 is near 48*11*4 = 2112, i.e. a 48:1 gearbox rather than
# 30:1 — plausible but unconfirmed.
#
# CAVEAT: this was fitted from floor distance, so any wheel slip is baked in
# as if it were encoder scale. A wheels-up revolution count would separate the
# two. Treat as "matches the tape", not "physically correct".
counts_per_rev: 2360.0
wheel_circumference_m: 0.248

# -1: a forward-turning wheel makes `get_motor_encoder` count DOWN on this
# unit (measured per motor, wheels up, 2026-08-28; the term its firmware PID
# gets backwards). bernard-3's board counts up and says +1. REQUIRED; the
# only two legal values. rm_base multiplies every encoder delta by it.
encoder_sign: -1

# Per-tick PWM change cap (drivetrain / STM32 protection). 20 Hz * 8 = full
# 60-count range in ~0.4 s.
max_pwm_step_per_tick: 8

# Any reconstructed wheel speed above this is a serial/decode glitch, not a
# measurement: it is discarded and the loop degrades to feedforward. The X3
# tops out well under 1 m/s per wheel.
max_plausible_wheel_mps: 2.0

# ---------------------------------------------------------------------------
# Closed-loop trim — used ONLY when rm_base_node runs control_mode:=closed_loop.
#
# The wheels above are a calibration; this is the controller. Feedforward is
# the per-wheel model above, so these gains only have to absorb the residual:
# load, tyre wear, and the failing front-right motor. Keep them small — the
# integrator's total authority is i_max_pwm, and that is the whole margin by
# which a bad measurement can push the PWM past the open-loop value.
#
# Feedback resolution sets the floor on useful gain. At 20 Hz with 1320
# counts/rev and a 0.204 m wheel, one encoder count per tick is
#   0.204 / 1320 * 20 = 0.0031 m/s
# so speeds down to ~0.02 m/s are resolved to a few percent. Do not raise the
# control rate past the board's auto-report rate chasing finer feedback — you
# get repeated samples, not more information (EncoderTracker rejects them).
closed_loop:
  gains:
    kp: 60.0          # PWM per (m/s) of instantaneous error
    ki: 80.0          # PWM per (m/s * s) of accumulated error
    i_max_pwm: 25.0   # hard ceiling on integral authority
  guards:
    stall_target_mps: 0.03    # commanded above this => expected to be turning
    stall_measured_mps: 0.01  # measured below this => "not turning"
    stall_ticks: 4            # ~200 ms at 20 Hz before freezing the integrator
    sign_fault_mps: 0.05      # reverse motion above this is real, not noise
    # NOTE: this block is splatted straight into wheel_control.Guards
    # (base_node.py), so ANY value here SHADOWS the module default. A 3 here
    # silently overrode the module's 12 through several hardware runs on
    # 2026-08-29 and kept latching wheels. If you change a guard default in
    # wheel_control.py, change it here too or delete the key.
    #
    # 3 ticks (0.15 s) was far too short: on a commanded reversal the wheel is
    # still coasting the old way, and the slew limiter needs ~8 ticks just to
    # walk the PWM across zero.
    sign_fault_ticks: 12
    # Ticks after a reversal during which the guard is suspended outright.
    sign_settle_ticks: 10

# Defensive backstop only — rm_safety is the real clamp and is always
# tighter. These just catch a grossly wrong /cmd_vel; keep them well above
# interface.yaml action scaling so a legitimate command is never clipped here.
max_body:
  vx: 0.5     # m/s
  vy: 0.5     # m/s
  wz: 1.5     # rad/s

# Per-wheel open-loop model: |pwm| = dead_pwm + gain_pwm_per_mps * |v|,
# zero below v_min_mps, clamped to +/- max_pwm.
#
# Per-wheel PWM model: pwm = dead_pwm + gain_pwm_per_mps * speed.
#
# dead_pwm is the push needed to START a stopped wheel; gain is the extra push
# per unit speed once it is rolling.
#
# REFITTED 2026-08-29 (second pass) from TWO STRAIGHT LEGS at 0.06 and
# 0.12 m/s, via scripts/diagnostics/fit_reverse.py, solving against MEASURED
# speed. The previous values (dead 12/20/34/13, gain 62/42/60/60) came from a
# fit that mixed one straight run with one SPIN — and a spin carries
# rotational scrub load, because the mecanum rollers must slide sideways. That
# extra PWM was misattributed to the dead-band, so dead_pwm came out far too
# high and gain far too low. The model then matched only at the single speed
# it was fitted at: straight-line distance at 0.10 m/s was correct, while
# cruise at 0.25 m/s undershot to ~87%.
#
# NEVER mix a turning measurement into this fit.
#
# Forward and reverse fits agreed within ~10% (reverse, on the floor: FL
# 1.8/157.0, BL 3.4/140.1, BR 4.8/141.3), so no dead_pwm_rev overrides are
# set — these wheels are effectively symmetric at these speeds and the
# integral absorbs the remainder.
#
# max_pwm ceilings restored to 60 (front_right 95) on 2026-08-29 when max_vx
# went to 0.25 m/s. The reduced floor-test ceiling of 35 was sized for a
# 0.15 m/s clamp; at 0.25 the model asks ~28-49 before any integral trim, and
# three of four wheels ran SATURATED at 33 and could not reach the commanded
# speed. Worst case now is feedforward + i_max: front_left 27.5+25, back_left
# 30.5+25, front_right 49+45, back_right 28+25 — which is what these ceilings
# are sized for. Raising max_vx again means redoing that sum.
#
# front_right was previously described as a failing motor needing ~5x the PWM.
# That was measured with the wheels in the air. On the floor it is not weak —
# over-driving it is what curved the robot left. It does still need the highest
# starting push of the four and its encoder reads unreliably at low speed.
wheels:
  front_left:
    dead_pwm: 1.3
    gain_pwm_per_mps: 162.9
    v_min_mps: 0.02
    max_pwm: 60
  back_left:
    # Highest starting push of the three healthy wheels: this one is
    # measurably stickier in REVERSE (dead at PWM 11, moves at 16), and
    # reverse is what turning on the spot needs from the left side.
    dead_pwm: 3.1
    gain_pwm_per_mps: 143.6
    v_min_mps: 0.02
    max_pwm: 60
  front_right:
    # UNFITTED AND KNOWN BAD. This wheel did not turn AT ALL in either
    # direction at applied PWM 42-49 (measured 0.0000 m/s across four
    # 6-second legs, wheels-up and on the floor), while the other three
    # tracked their targets to within a few percent.
    #
    # RETRACTION: earlier on 2026-08-29 this file said front-right was "not a
    # failing motor" because it appeared to track perfectly on the floor
    # (0.250 against a 0.254 target). That reading was the wheel being DRAGGED
    # by the other three — its encoder was reporting the robot's motion, not
    # its own drive. Suspiciously exact tracking was the tell. Wheels-up,
    # with nothing to drag it, it reads exactly zero. The original 2026-08-28
    # diagnosis (dead at low PWM, moves around 50) stands.
    #
    # These numbers are therefore STALE and left only so the wheel is not
    # over-driven while unmeasured: at max_vx they ask 49, which is below the
    # threshold, so front-right currently contributes NOTHING and the base is
    # effectively three-wheel drive. On a mecanum base that breaks the
    # kinematics and the robot will pull to the left.
    #
    # Measure the real threshold with scripts/diagnostics/fr_threshold.py
    # (wheels UP) before setting these. Do not simply raise dead_pwm to ~55 on
    # the strength of "it worked at 60 once" — that reading was also taken on
    # the floor with the wheel possibly being dragged.
    # MEASURED 2026-08-29, wheels-up, motor driven directly so nothing could
    # drag it (scripts/diagnostics/fr_threshold.py --curve):
    #
    #   breakaway   PWM 60 forward, 55 reverse   <- to START it turning
    #   running     dead 30.2 / gain 132.1 fwd,  <- to KEEP it turning
    #               dead 27.7 / gain 145.4 rev
    #
    # THE TWO ARE DIFFERENT AND THAT IS THE PROBLEM. This motor has severe
    # stiction: it needs roughly twice the PWM to break loose as to keep
    # going, and once it does break loose it runs freely at ~0.22 m/s. Its
    # running gain (132/145) is normal — in line with the other three
    # (163/144/127) — so the motor is not weak, it is sticky.
    #
    # The RUNNING fit is what is set below, deliberately. Using the breakaway
    # value as dead_pwm instead would command 66 PWM for a 0.05 m/s target and
    # the wheel would take off at ~0.28 m/s — massively overshooting at every
    # low speed. The running fit never over-drives.
    #
    # CONSEQUENCE, know this before trusting the base:
    #   * Forward at max_vx 0.25 the model asks 63, above the 60 breakaway, so
    #     front-right DOES start and contributes. Cruise is four-wheel drive.
    #   * A spin at max_wz 0.8 asks each wheel for only ~0.17 m/s -> 52 PWM,
    #     BELOW breakaway, so front-right never starts and turning is
    #     three-wheel drive. It would need wz > 1.06 rad/s to self-start,
    #     which is above the safety clamp.
    #   * Anything below ~0.23 m/s cannot self-start, though it will sustain
    #     down to ~0.1 m/s once already moving.
    #
    # The stall guard deliberately freezes the integrator on a stalled wheel,
    # so the loop will NOT wind up to break it loose — that guard is what
    # stops a runaway, and it should not be weakened for this. The real fixes
    # are a breakaway kick (apply breakaway PWM briefly when a commanded wheel
    # reads stalled, then fall back to the running model) or replacing the
    # motor. Neither is implemented.
    dead_pwm: 30.2
    gain_pwm_per_mps: 132.1
    dead_pwm_rev: 27.7
    gain_pwm_per_mps_rev: 145.4
    v_min_mps: 0.02
    max_pwm: 95
    # Breakaway kick, ENABLED FOR THIS WHEEL ONLY. The other three have no
    # stiction problem and get no kick — omitting these keys disables it.
    #
    # When this wheel is commanded and reads stalled, rm_base applies this PWM
    # for a bounded burst instead of the running model, then falls back.
    # Bounded three ways (wheel_control.Guards): 8 ticks per attempt, 20 ticks
    # of cooldown between attempts, and 3 attempts before it gives up until
    # the command clears. A wheel that will not move after three kicks is
    # blocked or broken, and holding a blocked motor at breakaway PWM is how
    # it burns out.
    #
    # Needed below roughly 0.14 m/s. Above that the loop's proportional term
    # already carries the output past breakaway on its own (at 0.17 m/s it
    # asks ~63 against the 60 threshold), so the kick never fires.
    breakaway_pwm: 60.0
    breakaway_pwm_rev: 55.0
    # This wheel needs more integral authority than the healthy three, and
    # its encoder only reads once it is already turning — so the stall guard
    # will fire on it during every start. That is intended: it holds
    # feedforward instead of winding up, which is exactly what the firmware
    # PID failed to do.
    gains:
      ki: 120.0
      i_max_pwm: 45.0
  back_right:
    dead_pwm: 6.5
    gain_pwm_per_mps: 126.6
    v_min_mps: 0.02
    max_pwm: 60
